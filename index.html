<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Debriefings — Mapa del Inversor</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e17;--card:#121826;--border:rgba(255,255,255,.07);--border-h:rgba(255,255,255,.12);
  --text:#e8edf6;--text-strong:#f1f5fb;--muted:#8a96ab;--hint:#6b7689;
  --accent:#3b82f6;--accent-bg:rgba(59,130,246,.16);
  --green:#34d399;--amber:#fbbf24;--red:#f87171;
  --surf:rgba(255,255,255,.03);
}
html,body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}

/* ─── App Header ─────────────────────────────────────────────────── */
.app-hdr{position:sticky;top:0;z-index:20;background:rgba(12,17,28,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);padding:0 26px;height:54px;
  display:flex;align-items:center;justify-content:space-between;gap:16px}

.funil-wrap{position:relative}
.funil-btn{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:9px;border:1px solid var(--border);background:var(--surf);color:var(--text);font-family:'DM Sans',sans-serif;font-size:12px}
.funil-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0}
.funil-name{font-size:12px;font-weight:600;color:var(--text-strong)}
.funil-status{font-size:9px;color:var(--accent);letter-spacing:.04em}
#sel-deb{background:transparent;border:none;color:var(--text-strong);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;outline:none;padding:0;max-width:230px}
#sel-deb option{background:#121826;color:var(--text)}
.funil-btn:hover{border-color:var(--border-h)}

.hdr-tabs{display:flex;align-items:center;gap:4px}
.htab{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:8px;border:none;background:transparent;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;color:var(--muted);transition:all .15s;white-space:nowrap}
.htab:hover{color:var(--text)}
.htab.htab-active{background:rgba(59,130,246,.16);color:#fff}
.htab-icon{font-size:13px}

.hdr-right{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--hint);font-family:'JetBrains Mono',monospace}

/* ─── Content ────────────────────────────────────────────────────── */
.app-content{max-width:1640px;margin:0 auto;padding:22px 30px 40px}
.page{display:none}.page.active{display:block}

.hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.hdr-title{font-size:22px;font-weight:700;font-family:'Sora',sans-serif;color:var(--text-strong);line-height:1.25}
.hdr-sub{margin-top:5px;font-size:11px;color:var(--hint);font-family:'JetBrains Mono',monospace}
.err{background:rgba(248,113,113,.06);border:1px solid rgba(248,113,113,.25);border-radius:8px;padding:12px 16px;margin-bottom:18px;font-size:13px;color:var(--red);line-height:1.5}
.note{background:rgba(59,130,246,.06);border:1px solid rgba(96,165,250,.2);border-radius:10px;padding:13px 16px;margin-bottom:18px;font-size:12px;color:var(--text);line-height:1.6}
.note b{color:var(--text-strong)}
.note-amber{background:rgba(251,191,36,.06);border-color:rgba(251,191,36,.22)}

/* KPIs */
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:13px}
.kc{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;transition:border-color .2s}
.status-legend{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.sl{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--hint)}
.sl-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.kc:hover{border-color:var(--border-h)}
.kc-lbl{font-size:9px;color:var(--hint);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;font-weight:700}
.kc-val{font-family:'JetBrains Mono',monospace;font-weight:600;letter-spacing:-.02em;font-size:22px;line-height:1.1;color:var(--text-strong)}
.kc-val-sm{font-size:18px}
.kc-sub{font-size:10px;color:var(--hint);margin-top:5px;font-family:'JetBrains Mono',monospace}

.section-lbl{font-size:9px;font-weight:700;color:var(--hint);text-transform:uppercase;letter-spacing:.09em;margin-bottom:10px;margin-top:20px}

/* Charts */
.cc{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 20px 14px}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.ct{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.lg{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.li{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted)}
.ll{width:14px;height:2px;border-radius:2px}
.ld{width:7px;height:7px;border-radius:50%}

.tip{background:#1a2236;border:1px solid var(--border-h);border-radius:8px;padding:10px 13px;font-size:12px;box-shadow:0 4px 16px rgba(2,6,20,.45);display:none;position:absolute;pointer-events:none;z-index:20;min-width:150px}
.tl{color:var(--hint);margin-bottom:5px;font-weight:500;font-size:10px;font-family:'JetBrains Mono',monospace}
.tr{display:flex;justify-content:space-between;gap:14px;margin-bottom:2px;font-size:11px}
.tv{color:var(--text-strong);font-weight:600;font-family:'JetBrains Mono',monospace}

/* Table */
table{width:100%;border-collapse:collapse}
th{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--hint);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.04);font-size:12px;color:var(--text)}
tr:hover td{background:rgba(255,255,255,.02)}
.mono{font-family:'JetBrains Mono',monospace}
td.mono,th.tar{white-space:nowrap}  /* número/dinheiro nunca quebra em duas linhas */
.tar{text-align:right}

/* Funnel bars */
.fn-row{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.fn-lbl{width:190px;flex-shrink:0;font-size:12px;color:var(--muted);font-weight:600}
.fn-track{flex:1;background:var(--surf);border-radius:7px;height:30px;position:relative;overflow:hidden}
.fn-fill{height:100%;border-radius:7px;display:flex;align-items:center;padding:0 12px;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:12px;color:#0a0e17;white-space:nowrap;transition:width .3s}
.fn-val{width:150px;flex-shrink:0;text-align:right;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-strong);font-weight:600}

.foot{margin-top:18px;font-size:10px;color:var(--hint);text-align:center;font-family:'JetBrains Mono',monospace;opacity:.5}
canvas{display:block}

/* Segment/platform selector pills — sempre alinhado à esquerda, abaixo do título */
.sel-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.sel-label{font-size:12px;color:var(--muted);font-weight:500}
.sel-hint{font-size:11px;color:var(--hint)}
.seg-pills{display:flex;gap:3px;background:var(--surf);border:1px solid var(--border);border-radius:9px;padding:3px}
.seg-pill{background:transparent;border:none;color:var(--muted);padding:5px 13px;border-radius:6px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;transition:all .15s;white-space:nowrap}
.seg-pill:hover{color:var(--text)}
.seg-pill.on{background:var(--text-strong);color:#0a0e17}

/* Chart overlay — botão discreto no canto direito do card (soma linha extra ao gráfico) */
.ov-btns{display:flex;align-items:center;gap:6px}
.btn-ov{background:transparent;border:1px solid var(--border);color:var(--muted);font-size:10px;font-weight:600;
  padding:4px 11px;border-radius:999px;cursor:pointer;transition:all .15s;white-space:nowrap;font-family:'DM Sans',sans-serif}
.btn-ov:hover{border-color:var(--border-h);color:var(--text)}
.btn-ov.on{background:rgba(59,130,246,.18);border-color:rgba(96,165,250,.45);color:#cfe0ff}
.ov-empty{font-size:11px;color:var(--hint);padding:14px 4px;text-align:center;font-style:italic}

/* Análise de qualificação — grid de painéis com barras horizontais */
.ql-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.ql-panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px 18px 14px}
.ql-panel-title{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:13px}
.ql-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ql-row:last-child{margin-bottom:0}
.ql-lbl{width:42%;flex-shrink:0;font-size:11px;color:var(--text);line-height:1.3}
.ql-track{flex:1;background:var(--surf);border-radius:5px;height:18px;position:relative;overflow:hidden}
.ql-fill{height:100%;border-radius:5px;background:var(--accent)}
.ql-val{flex-shrink:0;text-align:right;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-strong);font-weight:600;white-space:nowrap;min-width:90px}

/* Funil de performance (aba Principal) — cadeia de caixas ligadas por linha
   tracejada; caixas secundárias (métricas derivadas) em azul tracejado. */
.fp-scroll{overflow-x:auto}
.fp-grid{display:grid;grid-template-columns:repeat(8,minmax(112px,1fr));
  grid-template-rows:62px 80px 62px 62px 62px 62px;gap:18px 26px;min-width:1080px;padding:4px 2px 2px}
.fp-cell{height:100%;display:flex}
.fp-box{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:9px 8px;text-align:center;position:relative;display:flex;flex-direction:column;
  align-items:center;justify-content:center}
.fp-lbl{font-size:8.5px;color:var(--hint);text-transform:uppercase;letter-spacing:.06em;
  font-weight:700;margin-bottom:5px;line-height:1.25}
.fp-val{font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:600;
  color:var(--text-strong);line-height:1.1;white-space:nowrap}
.fp-sub{border-style:dashed;border-color:rgba(96,165,250,.4);background:rgba(59,130,246,.05)}
.fp-sub .fp-val{font-size:13px;color:#60a5fa}
.fp-h::after{content:"";position:absolute;top:50%;left:100%;width:26px;border-top:1px dashed rgba(96,165,250,.4)}
.fp-dn::after{content:"";position:absolute;top:100%;left:50%;height:18px;border-left:1px dashed rgba(96,165,250,.4)}
.fp-up::before{content:"";position:absolute;bottom:100%;left:50%;height:18px;border-left:1px dashed rgba(96,165,250,.4)}
.fp-up-long::before{content:"";position:absolute;bottom:100%;left:50%;height:98px;border-left:1px dashed rgba(96,165,250,.4)}

@media(max-width:768px){
  .app-hdr{height:auto;flex-wrap:wrap;padding:0;gap:0;align-items:stretch}
  .funil-wrap{padding:9px 14px;flex-shrink:0;border-bottom:1px solid var(--border);width:auto}
  .hdr-right{order:2;padding:8px 14px}
  .hdr-tabs{order:3;width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex-wrap:nowrap;gap:2px;padding:6px 14px 8px}
  .hdr-tabs::-webkit-scrollbar{display:none}
  .htab{flex-shrink:0;font-size:11px;padding:5px 10px}
  .app-content{padding:14px 10px 30px;max-width:100%}
  .hdr{flex-direction:column;gap:6px;margin-bottom:14px}
  .hdr-title{font-size:18px}
  .g2,.g3,.g4,.g5{grid-template-columns:repeat(2,1fr)!important;gap:8px!important}
  .kc{padding:12px 13px}
  .kc-val{font-size:18px}
  .kc-val-sm{font-size:15px}
  .fn-lbl{width:110px;font-size:11px}
  .fn-val{width:90px;font-size:11px}
  table{font-size:10px!important}
  td,th{padding:7px 8px!important;white-space:nowrap}
  .seg-pill{padding:5px 10px;font-size:11px}
  .ql-grid{grid-template-columns:1fr!important}
}
</style>
</head>
<body>
<header class="app-hdr">
  <div class="funil-wrap">
    <label class="funil-btn" for="sel-deb">
      <span class="funil-dot"></span>
      <div>
        <select id="sel-deb" onchange="trocaDebriefing(this.value)"></select>
        <div class="funil-status" id="deb-sub"></div>
      </div>
    </label>
  </div>
  <nav class="hdr-tabs" id="hdr-tabs"></nav>
  <div class="hdr-right" id="hdr-gerado"></div>
</header>

<div class="app-content" id="app-content">
</div>

function initCanvas(id,cssW,cssH){
  const c=document.getElementById(id);if(!c)return null;

}
function setupTip(cid,tid,data,lines,padL=46,padR=12){
  const c=document.getElementById(cid),t=document.getElementById(tid);
  if(!c||!t)return;
  c.addEventListener("mousemove",e=>{
    const rect=c.getBoundingClientRect();
    const relX=(e.clientX-rect.left)-padL;
    const cW=rect.width-padL-padR;
    if(relX<0||relX>cW||!data.length){t.style.display="none";return;}
    const d=data[Math.max(0,Math.min(Math.round((relX/cW)*(data.length-1)),data.length-1))];
    let h=`<div class="tl">${d.label||d.date}</div>`;
    lines.forEach(l=>{
      h+=`<div class="tr"><span style="color:${l.color}">${l.name}</span><span class="tv">${(l.fmt||fNum)(+(d[l.key])||0)}</span></div>`;
    });
    t.innerHTML=h;t.style.display="block";
    const tw=t.offsetWidth,x=e.clientX-rect.left;
    t.style.left=(x+12+tw>rect.width-8?x-tw-12:x+12)+"px";
    t.style.top=(e.clientY-rect.top-20)+"px";
  });
  c.addEventListener("mouseleave",()=>t.style.display="none");
}

// ── Farol de meta (3 níveis) — mesmo modelo usado no dashboard "index.html"
// (Carrinho ao vivo): 🟢 dentro da meta / 🟡 até 10% fora / 🔴 mais de 10% fora.
// higherIsBetter=true -> quanto maior melhor (ex: frequência); false -> quanto
// menor melhor (ex: CPC, custo/ficha).
function statusColor(val,meta,higherIsBetter){
  if(!val||val===0)return "#8a96ab";
  const ratio=val/meta;
  if(higherIsBetter){ if(ratio>=1)return "#34d399";if(ratio>=0.9)return "#fbbf24";return "#f87171"; }
  else { if(ratio<=1)return "#34d399";if(ratio<=1.1)return "#fbbf24";return "#f87171"; }
}
function statusBorder(val,meta,higherIsBetter){
  const c=statusColor(val,meta,higherIsBetter);
  if(c==="#34d399") return "rgba(52,211,153,.35)";
  if(c==="#fbbf24") return "rgba(251,191,36,.35)";
  if(c==="#f87171") return "rgba(248,113,113,.35)";
  return "var(--border)";
}
function metaEmoji(val,meta,higherIsBetter){
  if(meta===null||meta===undefined)return "";
  if(!val)return "🔴";
  const c=statusColor(val,meta,higherIsBetter);
  if(c==="#34d399")return "🟢";
  if(c==="#fbbf24")return "🟡";
  return "🔴";
}
function statusLegend(){
  return `<div class="status-legend">
    <span class="sl"><span class="sl-dot" style="background:#34d399"></span>Dentro da meta</span>
    <span class="sl"><span class="sl-dot" style="background:#fbbf24"></span>Até 10% fora</span>
    <span class="sl"><span class="sl-dot" style="background:#f87171"></span>Mais de 10% fora</span>
  </div>`;
}
// benchLabel: texto da meta mostrado embaixo do valor (ex: "meta: 3,48"). rawVal/
// meta/higher (opcionais): quando presentes, colorem a BORDA do card conforme o farol.
function kpiCard(lbl,val,sub,color,small,rawVal,meta,higher){
  const bord=(rawVal!==null&&rawVal!==undefined&&meta!==null&&meta!==undefined)?statusBorder(rawVal,meta,higher):"var(--border)";
  return `<div class="kc" style="border-color:${bord}">
    <div class="kc-lbl">${lbl}</div>

    ${sub?`<div class="kc-sub">${sub}</div>`:""}
  </div>`;
}
// Barra de funil com escala em raiz quadrada (senão a última etapa fica invisível
// perto das primeiras, que são ordens de grandeza maiores)
function funnelRow(lbl,val,maxVal,color){
  const pct=Math.max(4,Math.sqrt(val/maxVal)*100);
  return `<div class="fn-row">
    <div class="fn-lbl">${lbl}</div>
    <div class="fn-track"><div class="fn-fill" style="width:${pct}%;background:${color}">${fNum(val)}</div></div>
  </div>`;
}


function drawLineSingle(id,data,key,color,cssW,cssH,fmt){
  fmt=fmt||(v=>String(Math.round(v)));
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:14,r:30,b:28,l:52};
  const cW=cssW-P.l-P.r,cH=cssH-P.t-P.b;
  const vals=data.map(d=>d[key]||0);
  const maxV=Math.max(...vals,0.01)*1.2;
  const n=data.length;
  const xP=i=>P.l+(n>1?i/(n-1):0.5)*cW;
  const yP=v=>P.t+cH-(v/maxV)*cH;
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    ctx.fillStyle=TICK_C;ctx.font="9px 'JetBrains Mono',monospace";ctx.textAlign="right";
    ctx.fillText(fmt(maxV-(i/4)*maxV),P.l-5,y+3);
  }
  drawLineArea(ctx,xP,yP,vals,color,true);
  const step=n>28?3:n>14?2:1;
  ctx.fillStyle=TICK_C;ctx.font="9px 'JetBrains Mono',monospace";ctx.textAlign="center";
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,xP(i),P.t+cH+18);});
}

// Barras (eixo esquerdo) + 1 linha sobreposta opcional (eixo direito, escala própria) —
// mesmo padrão visual do dual-axis "Investimento × Custo/ficha": duas colunas de rótulos
// nas bordas, cada uma na cor da sua série.
function drawBarLineDual(id,data,barKey,barColor,barFmt,lineKey,lineColor,lineFmt,cssW,cssH){
  barFmt=barFmt||(v=>String(Math.round(v)));
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const hasLine=!!lineKey;
  const P={t:14,r:hasLine?58:30,b:28,l:52};
  const cW=cssW-P.l-P.r,cH=cssH-P.t-P.b;
  const barVals=data.map(d=>d[barKey]||0);
  const barMax=Math.max(...barVals,1)*1.15;
  const n=data.length;
  const barW=Math.max(4,Math.min(22,(cW/Math.max(n,1))*0.7));
  const xP=i=>P.l+(n>1?i/(n-1):0.5)*cW;
  const yPBar=v=>P.t+cH-(v/barMax)*cH;
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    ctx.fillStyle=TICK_C;ctx.font="9px 'JetBrains Mono',monospace";ctx.textAlign="right";
    ctx.fillText(barFmt(barMax-(i/4)*barMax),P.l-5,y+3);
  }
  drawBars(ctx,xP,yPBar,P.t+cH,barVals,barColor,barW);
  if(hasLine){
    const lineVals=data.map(d=>d[lineKey]||0);
    const lineMax=Math.max(...lineVals,0.01)*1.25;
    const yPLine=v=>P.t+cH-(v/lineMax)*cH;
    for(let i=0;i<=4;i++){
      const y=P.t+(i/4)*cH;
      ctx.fillStyle=lineColor;ctx.font="9px 'JetBrains Mono',monospace";ctx.textAlign="left";
      ctx.fillText(lineFmt(lineMax-(i/4)*lineMax),P.l+cW+5,y+3);
    }
    drawLineArea(ctx,xP,yPLine,lineVals,lineColor,false);
  }
  const step=n>28?3:n>14?2:1;
  ctx.fillStyle=TICK_C;ctx.font="9px 'JetBrains Mono',monospace";ctx.textAlign="center";
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,xP(i),P.t+cH+18);});
}

// Ordenação tolerante a coluna mista (texto + vazio, número + vazio): vazio vai
// sempre pro fim, e se qualquer um dos lados for texto compara como texto.
function sortRows(rows,st){
  const {col,dir}=st;
  const vazio=v=>v===null||v===undefined||v==="";
  return [...rows].sort((a,b)=>{
    const av=a[col], bv=b[col];
    if(vazio(av)&&vazio(bv))return 0;
    if(vazio(av))return 1;
    if(vazio(bv))return -1;
    if(typeof av==="string"||typeof bv==="string"){
      const r=String(av).localeCompare(String(bv));
      return dir==="asc"?r:-r;
    }
    return dir==="asc"?av-bv:bv-av;
  });
}

/* ════════════════════════════════════════════════════════════════════════
   SEGMENTO (Total / Tráfego / Orgânico) — seletor do modelo do oro_jul26.
   Neste lançamento 100% da captação veio de tráfego pago: não houve lista
   orgânica, então "Tráfego" repete o Total e "Orgânico" é zero por definição
   (o seletor fica pra manter a leitura igual à dos outros debriefings).
   Os 163 leads sem UTM de campanha continuam em Tráfego — perderam a UTM,
   mas vieram de anúncio; não são orgânicos.
   ════════════════════════════════════════════════════════════════════════ */
function principalView(){
  // "Tráfego" e "Orgânico" não são mais recortes vazios: a origem do lead vem
  // do UTM Source da base (quem veio de anúncio tem Source "FBAds_..."), e o
  // precompute entrega um bloco de captação e um de principal pra cada um.
  const vd=DATA.vendas;
  const seg=(S.segmento!=="total"&&DATA.segmentos)?DATA.segmentos[S.segmento]:null;
  if(!seg){
    const c=DATA.paises_temp.total.total;
    return {p:DATA.principal, vd, fx:c.faixas, cap:c, zero:false};
  }
  const c=seg.captacao;
  return {p:seg.principal, fx:c.faixas, cap:c, zero:false,
          vd:{...vd, total:seg.principal.vendas, com_lead:seg.principal.com_lead}};
}

/* ════════════════════════════════════════════════════════════════════════
   CAMPANHAS / ANÚNCIOS da captação (cross-filter)
   Campanhas e anúncios são filtrados por País × Temperatura (campos já
   calculados no precompute a partir do nome da campanha) e pela busca.
   A linha "Total" soma os valores BRUTOS das linhas visíveis (ou das
   selecionadas) e recalcula CPL/conversão/ROAS em cima da soma.
   ════════════════════════════════════════════════════════════════════════ */
// Colunas compartilhadas pelas tabelas de Campanhas e de Anúncios. Público, Leva,
// Cliques e Views da página saíram a pedido do Gustavo (05/10).
const METRIC_COLS=[
  ["leads","Leads","num"],["vendas","Vendas","num"],["conv","Conv. em vendas","pct"],
  ["custoLead","CPL","usd"],
  ["pctA","% Faixa A","pct"],["pctB","% Faixa B","pct"],["pctC","% Faixa C","pct"],["pctD","% Faixa D","pct"],
  ["pctPesquisa","% resp. pesquisa","pct"],
  ["investimento","Investimento","usd"],["faturamento","Faturamento","usd"],
  ["roas","ROAS","x"],["custoVenda","Custo/venda","usd"],
  ["cpc","CPC","usd"],["ctr","CTR","pct"],
];
const CAMP_COLS=[["campanha","Campanha","text"],...METRIC_COLS];
const AD_COLS=[["anuncio","Anúncio","text"],...METRIC_COLS];
function fmtCell(tipo,v){
  if(v===null||v===undefined)return "—";
  if(tipo==="text")return esc(v);
  if(tipo==="num")return fNum(v);
  if(tipo==="pct")return fPct(v);
  if(tipo==="usd")return fUSD(v);
  if(tipo==="x")return fX(v);
  return esc(v);
}
function calcRow(r){
  const leads=r.leads||0, vendas=r.vendas||0, fat=r.faturamento||0, inv=r.investimento||0;
  const resp=r.respondeu_pesquisa||0;
  return {...r,
    conv: leads?vendas/leads*100:0,
    custoLead: leads&&inv?inv/leads:null,
    custoVenda: vendas&&inv?inv/vendas:null,
    roas: inv?fat/inv:null,
    cpc: r.cliques?inv/r.cliques:null,
    ctr: r.impressoes?r.cliques/r.impressoes*100:null,
    pctPesquisa: leads?(r.respondeu_pesquisa||0)/leads*100:0,
    // % de cada faixa sobre quem RESPONDEU (não sobre o total de leads) — mesma
    // leitura da tabela de Faixas das abas Principal/Captação
    pctA: resp?(r.faixa_a||0)/resp*100:null,
    pctB: resp?(r.faixa_b||0)/resp*100:null,
    pctC: resp?(r.faixa_c||0)/resp*100:null,
    pctD: resp?(r.faixa_d||0)/resp*100:null,
  };
}
function sumRows(rows){
  const s={leads:0,vendas:0,faturamento:0,investimento:0,cliques:0,impressoes:0,lpv:0,
           respondeu_pesquisa:0,faixa_a:0,faixa_b:0,faixa_c:0,faixa_d:0};
  for(const r of rows){ for(const k in s) s[k]+=(r[k]||0); }
  return s;
}
// Consolida anúncios por NOME (o mesmo criativo roda em várias campanhas).
function groupAdsByName(rows){
  const by={};
  for(const r of rows){
    const k=r.anuncio||"(sem anúncio)";
    if(!by[k])by[k]={anuncio:k,instagram_url:r.instagram_url||null,leads:0,vendas:0,faturamento:0,
      investimento:0,cliques:0,impressoes:0,lpv:0,respondeu_pesquisa:0,
      faixa_a:0,faixa_b:0,faixa_c:0,faixa_d:0};
    const g=by[k];
    if(!g.instagram_url&&r.instagram_url)g.instagram_url=r.instagram_url;
    g.leads+=r.leads||0; g.vendas+=r.vendas||0; g.faturamento+=r.faturamento||0;
    g.investimento+=r.investimento||0; g.cliques+=r.cliques||0; g.impressoes+=r.impressoes||0;
    g.lpv+=r.lpv||0; g.respondeu_pesquisa+=r.respondeu_pesquisa||0;
    g.faixa_a+=r.faixa_a||0; g.faixa_b+=r.faixa_b||0; g.faixa_c+=r.faixa_c||0; g.faixa_d+=r.faixa_d||0;
  }
  return Object.values(by);
}
function setCampSearch(v){ keepFocus("camp-search-input",()=>{S.campSearch=v;}); }
function setAdSearch(v){ keepFocus("ad-search-input",()=>{S.adSearch=v;}); }
function toggleCamp(n){ S.selectedCamps.has(n)?S.selectedCamps.delete(n):S.selectedCamps.add(n); renderTab(S.currentPage); }
function clearCamps(){ S.selectedCamps.clear(); renderTab(S.currentPage); }
function toggleAd(n){ S.selectedAds.has(n)?S.selectedAds.delete(n):S.selectedAds.add(n); renderTab(S.currentPage); }
function clearAds(){ S.selectedAds.clear(); renderTab(S.currentPage); }
function sortCampanhas(col){ if(S.cSort.col===col)S.cSort.dir=S.cSort.dir==="asc"?"desc":"asc"; else S.cSort={col,dir:"desc"}; renderTab(S.currentPage); }
function sortAnuncios(col){ if(S.aSort.col===col)S.aSort.dir=S.aSort.dir==="asc"?"desc":"asc"; else S.aSort={col,dir:"desc"}; renderTab(S.currentPage); }
function adResumoText(){
  const g=groupAdsByName(DATA.campanhas_captacao.anuncios);
  return g.filter(a=>S.selectedAds.has(a.anuncio))
          .map(a=>`Nome do anúncio: ${a.anuncio}\nLink: ${a.instagram_url||"—"}\n-----------`).join("\n");
}
function copyAdResumo(){
  const t=adResumoText(); const box=document.getElementById("ad-resumo-box");
  if(box)box.value=t;
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).catch(()=>{});
}

  const trTotal=(row,label,cols,extra)=>row?`<tr style="border-top:2px solid var(--border-h);background:rgba(96,165,250,.07)">

  return `

      <span style="font-size:10px;color:var(--hint)">Clique numa campanha pra filtrar os anúncios abaixo</span>

    ${searchBox("camp-search-input",S.campSearch,"Buscar campanha…","setCampSearch")}
    <div class="cc" style="padding:0;overflow:hidden;margin-bottom:22px"><div style="overflow-x:auto">

      <div style="font-size:10px;color:var(--hint);margin-top:4px">Clique em "Gerar resumo" pra copiar pra área de transferência.</div>

    <div style="font-size:10px;color:var(--hint);margin-top:8px">Leads/vendas vêm da base de cadastros (UTM da campanha e do anúncio); investimento/cliques/impressões vêm da planilha do Meta, batidos pelo nome. Anúncios são consolidados por nome — o mesmo criativo rodando em 2 campanhas vira uma linha só.</div>`;

/* ════════════════════════════════════════════════════════════════════════
   BLOCO DE MÍDIA — motor único das abas Aquecimento, Lembrete, Aulas,
   Grupo VIP e do tráfego de Carrinho (dentro de Vendas).
   Fórmulas: CPC = investido/cliques · CTR = cliques/impressões ·
   Tx75% = 75% assistido / views · Cptx75% = investido / 75% assistido ·
   Connect rate = views da página / cliques. Toda linha de Total soma os
   brutos e recalcula as razões (nunca média de razão).
   ════════════════════════════════════════════════════════════════════════ */
const MIDIA_COLS_BASE=[
  ["anuncio","Anúncio","text"],["investido","Investido","usd"],["cliques","Cliques","num"],
  ["cpc","CPC","usd"],["impressoes","Impressões","num"],["ctr","CTR","pct"],["cpm","CPM","usd"],
];
const MIDIA_COLS_VIDEO=[["v75","75% assistido","num"],["v3s","Views","num"],["tx75","Tx 75%","pct"],["cptx75","Cptx75%","usd"]];
const MIDIA_COLS_LPV=[["lpv","Views da página","num"],["connect","Connect rate","pct"]];
const MIDIA_COLS_IC=[["checkouts","Checkouts","num"],["custo_checkout","Custo/checkout","usd"]];

function setMidiaMetric(tab,m){ S.midia[tab].metric=m; renderTab(S.currentPage); }
function setMidiaDias(tab,v){ S.midia[tab].dias=v; renderTab(S.currentPage); }
function setMidiaSearch(tab,v){ keepFocus(`midia-search-${tab}`,()=>{S.midia[tab].search=v;}); }
function sortMidia(tab,col){
  const st=S.midia[tab].sort;
  if(st.col===col)st.dir=st.dir==="asc"?"desc":"asc"; else S.midia[tab].sort={col,dir:"desc"};
  renderTab(S.currentPage);
}
function somaMidia(rows){
  const s={investido:0,cliques:0,impressoes:0,v75:0,v3s:0,lpv:0,checkouts:0};
  for(const r of rows) for(const k in s) s[k]+=(r[k]||0);
  s.cpc=s.cliques?s.investido/s.cliques:null;
  s.cpm=s.impressoes?s.investido/s.impressoes*1000:null;
  s.ctr=s.impressoes?s.cliques/s.impressoes*100:null;
  s.tx75=s.v3s?s.v75/s.v3s*100:null;
  s.cptx75=s.v75?s.investido/s.v75:null;
  s.connect=s.cliques?s.lpv/s.cliques*100:null;
  s.custo_checkout=s.checkouts?s.investido/s.checkouts:null;
  return s;
}
/* Retorna {html, draw} — quem chama injeta o html e roda draw() no próximo frame. */
function midiaBlock(tab,rep,opts){
  opts=opts||{};
  const st=S.midia[tab], t=rep.totais;
  const temVideo=(t.v3s||0)>0, temLpv=t.lpv!==undefined&&t.lpv!==null, temIC=t.checkouts!==undefined&&t.checkouts!==null;
  const COLS=[...MIDIA_COLS_BASE,...(temVideo?MIDIA_COLS_VIDEO:[]),...(temLpv?MIDIA_COLS_LPV:[]),...(temIC?MIDIA_COLS_IC:[])];
  // filtro de contagem regressiva (só o Lembrete usa)
  const DIAS_ORDER=["aviso_geral","1","2","3","4","5","6","7"];
  const diasPresentes=DIAS_ORDER.filter(k=>rep.anuncios.some(a=>a.dias_falta===k));
  const usaDias=opts.dias&&diasPresentes.length>0;
  let rows=rep.anuncios;
  if(usaDias&&st.dias!=="total")rows=rows.filter(a=>a.dias_falta===st.dias);
  const q=st.search.trim().toLowerCase();
  if(q)rows=rows.filter(a=>a.anuncio.toLowerCase().includes(q));
  const sorted=sortRows(rows,st);
  const tot=somaMidia(rows);
  // métricas disponíveis no gráfico de acumulado
  const metricas=[["cpc","CPC"],...(temVideo?[["tx75","Tx 75%"],["cptx75","Cptx75%"]]:[])];
  if(!metricas.some(([k])=>k===st.metric))st.metric="cpc";
  const kpisVideo=temVideo?`
    <div class="g3" style="margin-bottom:16px">
      ${kpiCard("75% assistido",fNum(t.v75),"visualizações de 75% do vídeo","var(--text-strong)")}
      ${kpiCard("Tx 75%",fPct(t.tx75),"75% assistido / views","var(--text-strong)")}
      ${kpiCard("Cptx75%",fUSDorDash(t.cptx75),"investido / 75% assistido","var(--text-strong)")}
    </div>`:"";
  const kpisLpv=temLpv?`
    <div class="${temIC?"g5":"g3"}" style="margin-bottom:16px">
      ${kpiCard("Views da página",fNum(t.lpv),"Action Landing Page View","var(--text-strong)")}
      ${kpiCard("Custo por view da página",fUSDorDash(t.cplpv),"investido / views da página","var(--text-strong)")}
      ${kpiCard("Connect rate",fPct(t.connect),"views da página / cliques no link","var(--text-strong)")}
      ${temIC?kpiCard("Checkouts iniciados",fNum(t.checkouts),"Action Omni Initiated Checkout","var(--text-strong)"):""}
      ${temIC?kpiCard("Custo por checkout",fUSDorDash(t.custo_checkout),"investido / checkouts iniciados","var(--text-strong)"):""}
    </div>`:"";
  const html=`
    <div class="g4" style="margin-bottom:13px">
      ${kpiCard("Investido total",fUSD(t.investido),rep.contas.join(" · "),"var(--text-strong)")}
      ${kpiCard("Cliques no link",fNum(t.cliques),`CPC ${fUSDorDash(t.cpc)}`,"var(--text-strong)")}
      ${kpiCard("Impressões",fNum(t.impressoes),`CPM ${fUSDorDash(t.cpm)}`,"var(--text-strong)")}
      ${kpiCard("CTR",fPct(t.ctr),"cliques no link / impressões","var(--text-strong)")}
    </div>
    ${kpisVideo}${kpisLpv}
    <div class="cc" style="position:relative;margin-bottom:16px">
      <div class="ch">
        <div><span class="ct">Acumulado por dia</span></div>
        <div class="ov-btns">${metricas.map(([k,lbl])=>
          `<button class="btn-ov${st.metric===k?" on":""}" onclick="setMidiaMetric('${tab}','${k}')">${lbl}</button>`).join("")}</div>
      </div>
      <div style="position:relative"><canvas id="c-${tab}-day"></canvas><div class="tip" id="t-${tab}-day"></div></div>
    </div>
    <div class="cc" style="position:relative;margin-bottom:16px">
      <div class="ch"><div><span class="ct">% do investimento por dia</span></div></div>
      <div style="position:relative"><canvas id="c-${tab}-pct"></canvas><div class="tip" id="t-${tab}-pct"></div></div>
    </div>
    ${rep.campanhas.length>1?`
    <div class="section-lbl">Campanhas</div>
    <div class="cc" style="padding:0;overflow:hidden;margin-bottom:16px"><div style="overflow-x:auto">
      <table>
        <thead><tr><th>Campanha</th>${COLS.slice(1).map(([,lbl])=>`<th class="tar">${lbl}</th>`).join("")}</tr></thead>
        <tbody>
          ${rep.campanhas.map(c=>`<tr><td style="white-space:nowrap">${esc(c.campanha)}</td>${COLS.slice(1).map(([col,,tipo])=>`<td class="mono tar">${fmtCell(tipo,c[col])}</td>`).join("")}</tr>`).join("")}
          <tr style="border-top:2px solid var(--border-h);background:rgba(96,165,250,.07)">
            <td style="font-weight:700">Total (${rep.campanhas.length})</td>
            ${COLS.slice(1).map(([col,,tipo])=>`<td class="mono tar" style="font-weight:700">${fmtCell(tipo,somaMidia(rep.campanhas)[col])}</td>`).join("")}</tr>
        </tbody>
      </table>
    </div></div>`:""}
    <div class="section-lbl" style="margin-top:20px">Anúncios</div>
    ${usaDias?segPills(st.dias,[["total","Todos"],...diasPresentes.map(k=>[k,DATA.dias_falta_labels[k]])],`((v)=>setMidiaDias('${tab}',v))`,"Contagem regressiva:","pelo nome do anúncio"):""}
    ${searchBox(`midia-search-${tab}`,st.search,"Buscar anúncio…",`((v)=>setMidiaSearch('${tab}',v))`)}
    <div class="cc" style="padding:0;overflow:hidden"><div style="overflow-x:auto">
      <table>
        <thead><tr>${COLS.map(([col,lbl,tipo])=>thSort(col,lbl,st,`((c)=>sortMidia('${tab}',c))`,tipo==="text"?"left":"right")).join("")}<th style="width:60px;text-align:center">Ver</th></tr></thead>
        <tbody>
          ${sorted.length?sorted.map(a=>`<tr>
            ${COLS.map(([col,,tipo])=>tipo==="text"
              ? `<td style="text-align:left;white-space:nowrap" title="${esc(a[col])}">${esc(a[col])}</td>`
              : `<td class="mono tar">${fmtCell(tipo,a[col])}</td>`).join("")}
            <td style="text-align:center;white-space:nowrap">${a.instagram_url?`<a href="${esc(a.instagram_url)}" target="_blank" rel="noopener noreferrer" style="color:#60a5fa;text-decoration:none;font-size:11px">↗ Ver</a>`:'<span style="color:var(--hint)">—</span>'}</td>
          </tr>`).join(""):`<tr><td colspan="${COLS.length+1}" style="text-align:center;color:var(--hint);padding:20px">Nenhum anúncio encontrado</td></tr>`}
          ${sorted.length?`<tr style="border-top:2px solid var(--border-h);background:rgba(96,165,250,.07)">
            ${COLS.map(([col,,tipo],i)=>i===0
              ? `<td style="font-weight:700;text-align:left;white-space:nowrap">Total (${sorted.length})</td>`
              : `<td class="mono tar" style="font-weight:700">${fmtCell(tipo,tot[col])}</td>`).join("")}<td></td></tr>`:""}
        </tbody>
      </table>
    </div></div>`;
  const draw=()=>{
    const box=document.getElementById(`c-${tab}-day`)?.parentElement;
    const key={cpc:"cum_cpc",tx75:"cum_tx75",cptx75:"cum_cptx75"}[st.metric];
    const color={cpc:C_AMBER,tx75:C_VENDA,cptx75:C_LEAD}[st.metric];
    const fmt=st.metric==="tx75"?(v=>v.toFixed(2)+"%"):fUSD;
    const data=rep.by_day.map(d=>({date:d.dia,label:fDateAula(d.dia),val:d[key]}));
    if(box)drawLineSingle(`c-${tab}-day`,data,"val",color,box.clientWidth,240,fmt);
    const nome={cpc:"CPC acumulado",tx75:"Tx75% acumulada",cptx75:"Cptx75% acumulado"}[st.metric];
    setupTip(`c-${tab}-day`,`t-${tab}-day`,data,[{name:nome,color,key:"val",fmt}]);
    const boxPct=document.getElementById(`c-${tab}-pct`)?.parentElement;
    const dataPct=rep.by_day.map(d=>({date:d.dia,label:fDateAula(d.dia),pct:d.pct_investido,investido:d.investido,cliques:d.cliques}));
    const fmtPct=v=>v.toFixed(1)+"%";
    if(boxPct)drawBarSingle(`c-${tab}-pct`,dataPct,"pct",C_AMBER,boxPct.clientWidth,220,fmtPct);
    setupTip(`c-${tab}-pct`,`t-${tab}-pct`,dataPct,[{name:"% do investimento",color:C_AMBER,key:"pct",fmt:fmtPct},
      {name:"Investido no dia",color:C_LEAD,key:"investido",fmt:fUSD},{name:"Cliques",color:C_VENDA,key:"cliques",fmt:fNum}]);
  };
  return {html,draw};
}

function paginaMidia(pageId,tab,rep,titulo,sub,extraTop,rodape,opts){
  const el=document.getElementById(pageId);
  const b=midiaBlock(tab,rep,opts);
  el.innerHTML=`
    <div class="hdr">
      <div>
        <div class="hdr-title">${titulo}</div>
        <div class="hdr-sub">${sub}</div>
      </div>
    </div>
    ${extraTop||""}
    ${b.html}
    <div class="foot">${rodape}</div>`;
  requestAnimationFrame(b.draw);
}

function renderAquecimento(){
  const r=DATA.aquecimento;
  paginaMidia("page-aquecimento","aquecimento",r,"Aquecimento",
    `${r.periodo} · vídeos de aquecimento pré-captação · ${r.contas.join(" · ")}`,
    `<div class="note">${DATA.notas.aquecimento}</div>`,
    `${RODAPE_MOEDA} · rótulos "D-N" = dias até a Aula 01 (${fDateBR(AULA1_ISO)}) · alcance e frequência não são somáveis linha a linha (sobreposição de audiência), então não aparecem aqui — precisam vir do Gerenciador no nível da conta`);
}
function renderLembrete(){
  const r=DATA.lembrete;

function leadsSemPais(){
  const t=DATA.paises_temp;
  const soma=Object.keys(t).filter(k=>k!=="total").reduce((a,k)=>a+t[k].total.leads_unicos,0);

}

function notaSegmento(){
  const n=DATA.notas.segmento;
  if(!n||typeof n==="string") return String(n||"");
  return [n[S.segmento], n.nota_vendas].filter(Boolean).join(" ");
}
// Vendas que não aparecem em nenhuma temperatura: são de leads sem UTM de
// campanha (orgânico, ou tráfego cujo UTM não resolveu).
function vendasSoNoTotal(){
  const t=DATA.paises_temp.total;
  return t.total.vendas - ["quente","morno","frio"].reduce((a,k)=>a+(t[k]?t[k].vendas:0),0);
}
function notaSoNoTotal(){
  const n=vendasSoNoTotal();
  if(!n) return "";
  return `O mesmo vale pras vendas: <b>${fNum(n)}</b> das ${fNum(DATA.paises_temp.total.total.vendas)} `+
         `vêm de leads sem campanha, então a soma das temperaturas dá `+
         `${fNum(DATA.paises_temp.total.total.vendas-n)} e não o total.`;
}

        <td class="mono">${v.ticket===null?"(fora dos tickets)":"$ "+fNum(v.ticket)}${v.precos&&v.precos.length?`<div style="color:var(--hint);font-size:10px;margin-top:2px">${esc(v.precos.join(" · "))}</div>`:""}</td>
        <td class="mono tar">${fNum(v.compradores)}</td>
        <td class="mono tar">${fNum(v.cadastraram)}</td>
        <td class="mono tar">${fPct(v.pct_cadastraram)}</td>
        <td class="mono tar">${fNum(v.vendas)}</td>
        <td class="mono tar">${fPct(v.conv)}</td></tr>`).join("")}</tbody>
    </table></div></div>`;
}

function perpBaseTable(b){
  const linhas=[...b.por_produto];
  return `<table>
    <thead><tr><th>Perpétuo</th><th class="tar">Leads do lançamento</th>
      <th class="tar">% da base</th><th class="tar">Vendas</th><th class="tar">Conversão</th></tr></thead>
    <tbody>
      ${linhas.map(r=>`<tr><td>${esc(r.produto)}</td>
        <td class="mono tar">${fNum(r.leads)}</td>
        <td class="mono tar">${fPct(r.pct)}</td>
        <td class="mono tar">${fNum(r.vendas)}</td>
        <td class="mono tar">${fPct(r.conv)}</td></tr>`).join("")}
      <tr style="border-top:2px solid var(--border-h);background:rgba(96,165,250,.07);font-weight:700">
        <td>Qualquer perpétuo${b.mais_de_um?` (${fNum(b.mais_de_um)} compraram mais de um)`:""}</td>
        <td class="mono tar">${fNum(b.com_perpetuo)}</td>
        <td class="mono tar">${fPct(b.pct)}</td>
        <td class="mono tar">${fNum(b.comparativo[0].vendas)}</td>
        <td class="mono tar">${fPct(b.comparativo[0].conv)}</td></tr>
    </tbody></table>`;
}

function perpComparativoTable(b){
  return `<table>
    <thead><tr><th>Lead do lançamento</th><th class="tar">Leads</th><th class="tar">Vendas</th><th class="tar">Conversão</th></tr></thead>
    <tbody>${b.comparativo.map(r=>`<tr>
      <td>${esc(r.label)}</td>
      <td class="mono tar">${fNum(r.leads)}</td>
      <td class="mono tar">${fNum(r.vendas)}</td>
      <td class="mono tar" style="color:${r.conv>=2?C_VENDA:"var(--text)"};font-weight:600">${fPct(r.conv)}</td></tr>`).join("")}
    </tbody></table>`;
}

function renderPerpetuo(){
  const el=document.getElementById("page-perpetuo");
  const P=DATA.perpetuo, b=P.base_lancamento;
  const todos=P.resumo[P.resumo.length-1];
  const periodos=Object.entries(P.periodos).map(([k,v])=>`${k}: ${v}`).join(" · ");
  el.innerHTML=`
    <div class="hdr"><div>
      <div class="hdr-title">Análise perpétuo</div>
      <div class="hdr-sub">compras aprovadas até ${P.corte} (dia da Aula 01) · ${fNum(P.compradores)} compradores distintos</div>
    </div></div>
    <div class="g4" style="margin-bottom:13px">
      ${kpiCard("Compradores de perpétuo",fNum(P.compradores),periodos,"var(--text-strong)")}
      ${kpiCard("Se cadastraram no lançamento",fPct(todos.pct_cadastraram),`${fNum(todos.cadastraram)} de ${fNum(P.compradores)}`,"var(--text-strong)")}
      ${kpiCard("Compraram no lançamento",fNum(todos.vendas),`${fNum(todos.vendas_sem_cadastro)} sem nem ter se cadastrado · ${fUSD(todos.faturamento)}`,C_VENDA)}
      ${kpiCard("Conversão de quem se cadastrou",fPct(todos.conv_cadastrados),`${fNum(todos.vendas_cadastrados)} de ${fNum(todos.cadastraram)} cadastrados`,C_VENDA)}
    </div>
    <div class="g4" style="margin-bottom:16px">
      ${kpiCard("Leads que já eram clientes",fNum(b.com_perpetuo),`${fPct(b.pct)} dos ${fNum(b.leads)} leads do lançamento`,"var(--text-strong)")}
      ${kpiCard("Conversão deles",fPct(b.comparativo[0].conv),`${fNum(b.comparativo[0].vendas)} vendas`,C_VENDA)}
      ${kpiCard("Conversão de quem nunca comprou",fPct(b.comparativo[1].conv),`${fNum(b.comparativo[1].vendas)} vendas em ${fNum(b.comparativo[1].leads)} leads`,"var(--text-strong)")}
      ${kpiCard("Quantas vezes mais",b.multiplo?fX(b.multiplo):"—","quem já era cliente converte isso a mais",C_AMBER)}
    </div>
    <div class="section-lbl">Por perpétuo</div>
    <div class="cc" style="margin-bottom:6px">${perpResumoTable(P.resumo)}</div>
    <div style="font-size:10px;color:var(--hint);margin-bottom:16px">"Conv. sobre todos os compradores" = quem comprou no lançamento ÷ todos os compradores do perpétuo. "Conv. sobre os cadastrados" = dos que se cadastraram no lançamento, quantos compraram ÷ quantos se cadastraram. A diferença entre as duas é quem comprou sem nunca ter se cadastrado, que entra só na primeira.</div>
    <div class="section-lbl">Quanto da base do lançamento já era cliente</div>
    <div class="cc" style="margin-bottom:16px">${perpBaseTable(b)}</div>
    <div class="section-lbl">Conversão em venda: já era cliente x nunca comprou</div>
    <div class="cc" style="margin-bottom:16px">${perpComparativoTable(b)}</div>
    <div class="section-lbl">Origem do cadastro de quem já era cliente</div>
    <div class="cc" style="margin-bottom:16px">${perpOrigemTable(P.origem)}</div>
    <div class="section-lbl">Qualificação em faixas (de quem se cadastrou no lançamento)</div>
    <div class="g2" style="margin-bottom:16px">${P.faixas.map(perpFaixaTable).join("")}</div>
    <div class="section-lbl">Teste de preço: conversão por ticket do perpétuo</div>
    <div class="g2" style="margin-bottom:16px">${P.tickets.map(perpTicketTable).join("")}</div>
    <div class="foot">${RODAPE_MOEDA} · ${fNum(P.linhas_arquivos)} vendas aprovadas nos arquivos de perpétuo, ${fNum(P.compradores)} pessoas distintas até ${P.corte} · ${fNum(b.vendas_sem_cadastro)} das ${fNum(b.vendas_sem_lead_total)} vendas do lançamento que não casaram com lead vieram de quem já tinha comprado perpétuo</div>`;
}

</script>
</body>
</html>
